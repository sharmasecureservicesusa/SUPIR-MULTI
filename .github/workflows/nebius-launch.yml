name: Submit Nebius Serverless Batch Job

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'batch'
        type: choice
        options:
          - batch
          - endpoint
      image_tag:
        description: 'Docker Image Tag to Run'
        required: true
        default: 'latest'
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  submit-serverless-job:
    name: Submit Serverless Job (Dual-L40S)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nebius CLI
        run: |
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "$HOME/.nebius/bin" >> $GITHUB_PATH
          sudo ln -sf "$HOME/.nebius/bin/nebius" /usr/local/bin/nebius || true

      - name: Authenticate with Nebius Cloud
        run: |
          mkdir -p ~/.nebius
          echo '${{ secrets.NEBIUS_SA_CREDENTIALS }}' > ~/.nebius/credentials.json
          nebius profile create default \
            --endpoint api.nebius.cloud \
            --parent-id "${{ secrets.NEBIUS_PARENT_ID }}" \
            --service-account-file ~/.nebius/credentials.json

      - name: Submit Serverless AI Job
        id: submit_job
        run: |
          JOB_NAME="supir-batch-$(date +%s)"
          PARENT_ID="${{ secrets.NEBIUS_PARENT_ID }}"
          FULL_IMAGE="${IMAGE_NAME}:${{ github.event.inputs.image_tag }}"

          echo "Submitting Serverless AI Job '$JOB_NAME'..."
          echo "Image: $FULL_IMAGE"
          echo "Platform: gpu-l40s-d | Preset: 2gpu-64vcpu-384gb"

          nebius serverless job create \
            --parent-id "$PARENT_ID" \
            --name "$JOB_NAME" \
            --container-image "$FULL_IMAGE" \
            --resources-platform "gpu-l40s-d" \
            --resources-preset "2gpu-64vcpu-384gb" \
            --preemptible \
            --environment "MODE=${{ github.event.inputs.mode }}" \
            --environment "S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" \
            --environment "S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}" \
            --environment "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" \
            --format json > job_output.json

          JOB_ID=$(jq -r '.metadata.id' job_output.json)
          echo "JOB_ID=$JOB_ID" >> $GITHUB_OUTPUT
          echo "✓ Successfully submitted Serverless Job ID: $JOB_ID"

      - name: Monitor Job Execution
        run: |
          JOB_ID="${{ steps.submit_job.outputs.JOB_ID }}"
          echo "Fetching status for Serverless Job: $JOB_ID"
          nebius serverless job get --id "$JOB_ID"